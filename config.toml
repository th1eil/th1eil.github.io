# The URL the site will be built for
base_url = "https://th1eil.github.io"
title = "Rei's Blog"
description = "花落水痕·风起铃升"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

# 每页文章数（也受 content/_index.md 和 content/blog/_index.md 控制）
# taxonomies = ...

# 添加分类配置
taxonomies = [
    {name = "tags", feed = true}, # 为标签创建 RSS feed
]

[markdown]
# 关闭 Zola 内联高亮（会把 Monokai 颜色写死在标签上）。
# 代码块交给 Prism，方便随昼读 / 夜读切换配色。
highlight_code = false

# 压缩 HTML 输出（Zola 内建，无需额外配置）
minify_html = true

[extra]
# Put all your custom variables here
