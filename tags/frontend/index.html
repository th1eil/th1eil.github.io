  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js" crossorigin="anonymous" data-manual></script>
  <script>
    (function() {
      if (!window.Prism) return;
      var langs = [];
      document.querySelectorAll('code[class*="language-"]').forEach(function(code) {
        var match = code.className.match(/language-([\w#+-]+)/);
        var pre = code.parentElement;
        if (!match || !pre) return;
        pre.classList.add('code-block');
        pre.setAttribute('data-lang', match[1]);
        if (langs.indexOf(match[1]) === -1) langs.push(match[1]);
      });
      if (!langs.length) return;

      var needs = { jsp: ['java'], cpp: ['c'] };
      var order = [];
      function add(lang) {
        (needs[lang] || []).forEach(add);
        if (order.indexOf(lang) === -1) order.push(lang);
      }
      langs.forEach(add);

      function loadAt(i) {
        if (i >= order.length) {
          Prism.highlightAll();
          return;
        }
        var lang = order[i];
        if (Prism.languages[lang]) {
          loadAt(i + 1);
          return;
        }
        var script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-' + lang + '.min.js';
        script.onload = script.onerror = function() {
          script.remove();
          loadAt(i + 1);
        };
        document.body.appendChild(script);
      }
      loadAt(0);
    })();
  </script>

  <script src="https://th1eil.github.io/js/view-counter.js" defer></script>

  <script>
    (function() {
      var btn = document.getElementById('backToTop');
      if (!btn) return;
      var ticking = false;
      window.addEventListener('scroll', function() {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(function() {
          btn.classList.toggle('is-visible', window.scrollY > 420);
          ticking = false;
        });
      }, { passive: true });
      btn.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    })();
  </script>

  <script>
    (function() {
      var toggle = document.getElementById('theme-toggle');
      if (!toggle) return;
      var meta = document.querySelector('meta[name="theme-color"]');

      function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#17140f' : '#f3ecdf');
      }

      toggle.addEventListener('click', function() {
        var current = document.documentElement.getAttribute('data-theme');
        setTheme(current === 'dark' ? 'light' : 'dark');
      });
    })();
  </script>
