{% extends "base.html" %}

{% block content %}
<div class="sheet sheet-narrow">
  <header class="page-head">
    <p class="page-kicker">门类</p>
    <h1>{{ term.name }}</h1>
    <p class="page-note">共 {{ term.pages | length }} 篇</p>
  </header>

  <ol class="contents-list">
    {% for page in term.pages %}
      {% set entry_index = loop.index %}
      {% set entry_page = page %}
      {% include "partials/entry.html" %}
    {% endfor %}
  </ol>
</div>
{% endblock content %}
